name: "Prod Build"
run-name: "3.0.${{ github.run_number }}"

env:
  FW_VERSION: "3.0.${{ github.run_number }}"
  FW_VERSION_DEVICE: "3.0.${{ github.run_number }}"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pre_flight:
    name: "Pre-Flight & Risk Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate Firmware Configuration
        run: python tools/validate_firmware_config.py

      - name: AI Firmware Risk Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/ai_risk_analysis.py --strict --output risk_report.md

      - name: Upload Risk Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epaper_risk_report_${{ env.FW_VERSION }}
          path: risk_report.md
          if-no-files-found: ignore

  build:
    name: "Build ${{ matrix.suffix }}"
    runs-on: ubuntu-latest
    needs: pre_flight
    strategy:
      matrix:
        include:
          - epd_type: 13INCH
            suffix: epd13
          - epd_type: 7INCH
            suffix: epd7
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Restore PlatformIO Cache
        id: cache-pio-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('deploy/platformio.ini') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ hashFiles('deploy/platformio.ini') }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Inject secrets.h
        env:
          SECRETS_H: ${{ secrets.SECRETS_H }}
        run: |
          echo "$SECRETS_H" > src/secrets.h

      - name: Inject .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          echo "$ENV_FILE" > .env

      - name: Set version and debug flag
        run: |
          newversion="${{ env.FW_VERSION_DEVICE }}"
          
          # Replace version in types.h
          sed -i -e "s/0\.0\.0/$newversion/g" src/types.h
          
          # Replace DEBUG flag in types.h
          sed -i -E "s/#define DEBUG [01]/#define DEBUG 0/g" src/types.h
          
          # Remove test() call from main.cpp
          sed -i '/test();.*please remove/d' src/main.cpp
          
          cp ./deploy/platformio.ini ./platformio.ini

      - name: Install PlatformIO Dependencies
        run: pio pkg install

      - name: Run PlatformIO Build
        id: build
        run: |
          if ! pio run -e ${{ matrix.suffix }}; then
            echo "::warning::Build with cache failed. Retrying clean build..."
            rm -rf .pio
            pio pkg install
            pio run -e ${{ matrix.suffix }}
            echo "rebuild=true" >> $GITHUB_OUTPUT
          fi

      - name: Check Firmware Size and Partition Limit
        run: |
          python tools/check_firmware_size.py ./.pio/build/${{ matrix.suffix }}/firmware.bin --target ${{ matrix.suffix }}

      - name: Save PlatformIO Cache
        if: steps.cache-pio-restore.outputs.cache-matched-key == '' || steps.build.outputs.rebuild == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('deploy/platformio.ini') }}-${{ github.run_id }}

      - name: Verify and Prepare Artifacts
        run: |
          if [ ! -f "./.pio/build/${{ matrix.suffix }}/firmware.bin" ]; then
            echo "::error::Build failed: firmware.bin was not created."
            exit 1
          fi
          
          ls -la
          mkdir artifact
          newversion="${{ env.FW_VERSION_DEVICE }}"
          
          # Base files
          cp ./.pio/build/${{ matrix.suffix }}/firmware.bin ./artifact/firmware_${{ matrix.suffix }}.bin
          cp ./.pio/build/${{ matrix.suffix }}/firmware.bin ./artifact/firmware_${{ matrix.suffix }}_pre.bin
          
          # JSON files mapping
          cat deploy/espfota.json | sed "s/X.X.X/$newversion/g" | sed "s|http://sample.de/firmware.bin|http://${{ secrets.S3_BUCKET_NAME }}/firmware_${{ matrix.suffix }}.bin|g" > ./artifact/espfota_${{ matrix.suffix }}.json
          cat deploy/espfota.json | sed "s/X.X.X/$newversion/g" | sed "s|http://sample.de/firmware.bin|http://${{ secrets.S3_BUCKET_NAME }}/firmware_${{ matrix.suffix }}_pre.bin|g" > ./artifact/espfota_${{ matrix.suffix }}_pre.json

      - name: Publish Pipeline Artifact
        uses: actions/upload-artifact@v7
        with:
          name: epaper_fw_${{ matrix.suffix }}_${{ env.FW_VERSION }}
          path: artifact/

  hil_test_epd7:
    name: "HIL Test: EPD7 (7.5\" Hardware)"
    runs-on: [self-hosted, Windows, hil-testbench]
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Testbench Dependencies
        run: pip install -r testbench/requirements.txt

      - name: Download EPD7 Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: epaper_fw_epd7_${{ env.FW_VERSION }}
          path: build_artifact_epd7

      - name: Run EPD7 HIL Testbench
        env:
          RESET_METHOD: relay_hex
          CANDIDATE_FIRMWARE_EPD7: "${{ github.workspace }}/build_artifact_epd7/firmware_epd7.bin"
          HIL_WIFI_SSID: ${{ secrets.HIL_WIFI_SSID }}
          HIL_WIFI_PASSWORD: ${{ secrets.HIL_WIFI_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
          AWS_IOT_ENDPOINT: ${{ secrets.AWS_IOT_ENDPOINT }}
          HIL_API_BASE_URL: ${{ secrets.HIL_API_BASE_URL }}
          HIL_S3_BUCKET: ${{ secrets.HIL_S3_BUCKET }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH_0_CLIENT_SECRET: ${{ secrets.AUTH_0_CLIENT_SECRET }}
          AUTH_0_AUDIENCE: ${{ secrets.AUTH_0_AUDIENCE }}
          AUTH_0_GRANT_TYPE: ${{ secrets.AUTH_0_GRANT_TYPE }}
        run: |
          python -m testbench.run_testbench --target epd7 --junitxml junit_epd7.xml -v

      - name: Upload EPD7 JUnit Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epaper_junit_epd7_${{ env.FW_VERSION }}
          path: junit_epd7.xml
          if-no-files-found: ignore

  hil_test_epd13:
    name: "HIL Test: EPD13 (13.3\" Hardware)"
    runs-on: [self-hosted, Windows, hil-testbench]
    needs: hil_test_epd7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Testbench Dependencies
        run: pip install -r testbench/requirements.txt

      - name: Download EPD13 Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: epaper_fw_epd13_${{ env.FW_VERSION }}
          path: build_artifact_epd13

      - name: Run EPD13 HIL Testbench
        env:
          RESET_METHOD: relay_hex
          CANDIDATE_FIRMWARE_EPD13: "${{ github.workspace }}/build_artifact_epd13/firmware_epd13.bin"
          HIL_WIFI_SSID: ${{ secrets.HIL_WIFI_SSID }}
          HIL_WIFI_PASSWORD: ${{ secrets.HIL_WIFI_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
          AWS_IOT_ENDPOINT: ${{ secrets.AWS_IOT_ENDPOINT }}
          HIL_API_BASE_URL: ${{ secrets.HIL_API_BASE_URL }}
          HIL_S3_BUCKET: ${{ secrets.HIL_S3_BUCKET }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH_0_CLIENT_SECRET: ${{ secrets.AUTH_0_CLIENT_SECRET }}
          AUTH_0_AUDIENCE: ${{ secrets.AUTH_0_AUDIENCE }}
          AUTH_0_GRANT_TYPE: ${{ secrets.AUTH_0_GRANT_TYPE }}
        run: |
          python -m testbench.run_testbench --target epd13 --junitxml junit_epd13.xml -v

      - name: Upload EPD13 JUnit Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epaper_junit_epd13_${{ env.FW_VERSION }}
          path: junit_epd13.xml
          if-no-files-found: ignore

  deploy_pre:
    name: "S3 Deployment (Pre)"
    runs-on: ubuntu-latest
    needs: [build, hil_test_epd7, hil_test_epd13]
    if: needs.build.result == 'success' && needs.hil_test_epd7.result == 'success' && (needs.hil_test_epd13.result == 'success' || needs.hil_test_epd13.result == 'skipped')
    environment: s3-upload-dev
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: S3 Upload Firmware and JSON (Pre)
        run: |
          for dir in all-artifacts/epaper_fw_*/ ; do
            [ -d "$dir" ] || continue
            
            aws s3 cp "$dir" s3://${{ secrets.S3_BUCKET_NAME }}/ --recursive --exclude "*" --include "firmware_*_pre.bin" --include "espfota_*_pre.json" --acl public-read
            
            # Zip needs to contain non-pre versions!
            folder_name=$(basename "$dir")
            cd "$dir"
            zip -r "../../${folder_name}.zip" firmware_*.bin espfota_*.json -x "*_pre*"
            cd ../../
            aws s3 cp "${folder_name}.zip" s3://${{ secrets.S3_BUCKET_NAME }}/ --acl public-read
          done

  deploy_prod_epd7:
    name: "S3 Deployment (Prod EPD7)"
    runs-on: ubuntu-latest
    needs: deploy_pre
    environment: s3-upload-epd7
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: S3 Upload Firmware and JSON (Prod EPD7)
        run: |
          for dir in all-artifacts/epaper_fw_*/ ; do
            [ -d "$dir" ] || continue
            aws s3 cp "$dir" s3://${{ secrets.S3_BUCKET_NAME }}/ --recursive --exclude "*" --include "firmware_epd7.bin" --include "espfota_epd7.json" --acl public-read
          done

  deploy_prod_epd13:
    name: "S3 Deployment (Prod EPD13)"
    runs-on: ubuntu-latest
    needs: deploy_pre
    environment: s3-upload-epd13
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: S3 Upload Firmware and JSON (Prod EPD13)
        run: |
          for dir in all-artifacts/epaper_fw_*/ ; do
            [ -d "$dir" ] || continue
            aws s3 cp "$dir" s3://${{ secrets.S3_BUCKET_NAME }}/ --recursive --exclude "*" --include "firmware_epd13.bin" --include "espfota_epd13.json" --acl public-read
          done

  report:
    name: "Testprotokoll & Release-Bewertung"
    runs-on: ubuntu-latest
    needs: [pre_flight, build, hil_test_epd7, hil_test_epd13, deploy_pre, deploy_prod_epd7, deploy_prod_epd13]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Download Risk Report Artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: epaper_risk_report_${{ env.FW_VERSION }}
          path: risk_artifacts

      - name: Download EPD7 JUnit Results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: epaper_junit_epd7_${{ env.FW_VERSION }}
          path: test_artifacts

      - name: Download EPD13 JUnit Results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: epaper_junit_epd13_${{ env.FW_VERSION }}
          path: test_artifacts

      - name: Generate Test Protocol & Step Summary
        env:
          FW_VERSION: ${{ env.FW_VERSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          risk_arg=""
          [ -f "risk_artifacts/risk_report.md" ] && risk_arg="--risk-report risk_artifacts/risk_report.md"
          
          epd7_arg=""
          [ -f "test_artifacts/junit_epd7.xml" ] && epd7_arg="--junit-epd7 test_artifacts/junit_epd7.xml"
          
          epd13_arg=""
          [ -f "test_artifacts/junit_epd13.xml" ] && epd13_arg="--junit-epd13 test_artifacts/junit_epd13.xml"

          deploy_status="success"
          if [ "${{ needs.deploy_pre.result }}" = "failure" ] || [ "${{ needs.deploy_prod_epd7.result }}" = "failure" ] || [ "${{ needs.deploy_prod_epd13.result }}" = "failure" ] || [ "${{ needs.deploy_pre.result }}" = "cancelled" ] || [ "${{ needs.deploy_prod_epd7.result }}" = "cancelled" ] || [ "${{ needs.deploy_prod_epd13.result }}" = "cancelled" ]; then
            deploy_status="failure"
          elif [ "${{ needs.deploy_pre.result }}" = "skipped" ] || [ "${{ needs.deploy_prod_epd7.result }}" = "skipped" ] || [ "${{ needs.deploy_prod_epd13.result }}" = "skipped" ]; then
            deploy_status="skipped"
          fi

          python tools/generate_test_protocol.py \
            --fw-version "${{ env.FW_VERSION }}" \
            --commit-sha "${{ github.sha }}" \
            --deploy-status "$deploy_status" \
            --deploy-name "prod" \
            $risk_arg $epd7_arg $epd13_arg \
            --output-md hil_test_protocol.md \
            --output-json hil_test_protocol.json

      - name: Publish Test Protocol Artifact
        uses: actions/upload-artifact@v7
        with:
          name: epaper_hil_protocol_${{ env.FW_VERSION }}
          path: |
            hil_test_protocol.md
            hil_test_protocol.json

      - name: Enforce Strict Pipeline Status
        run: |
          echo "Prüfe Gesamtstatus aller Pipeline-Jobs..."
          echo "Pre-Flight Status:         ${{ needs.pre_flight.result }}"
          echo "Build Status:              ${{ needs.build.result }}"
          echo "EPD7 Test Status:          ${{ needs.hil_test_epd7.result }}"
          echo "EPD13 Test Status:         ${{ needs.hil_test_epd13.result }}"
          echo "Deploy Pre Status:         ${{ needs.deploy_pre.result }}"
          echo "Deploy Prod EPD7 Status:   ${{ needs.deploy_prod_epd7.result }}"
          echo "Deploy Prod EPD13 Status:  ${{ needs.deploy_prod_epd13.result }}"

          if [ "${{ needs.pre_flight.result }}" != "success" ]; then
            echo "::error::Pre-Flight Prüfung oder Risikoanalyse fehlgeschlagen! Pipeline wird abgebrochen."
            exit 1
          fi

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Firmware-Build fehlgeschlagen! Pipeline wird abgebrochen."
            exit 1
          fi
          
          if [ "${{ needs.hil_test_epd7.result }}" != "success" ]; then
            echo "::error::HIL Test für EPD7 fehlgeschlagen oder abgebrochen! Pipeline wird beendet."
            exit 1
          fi
          
          if [ "${{ needs.hil_test_epd13.result }}" != "success" ] && [ "${{ needs.hil_test_epd13.result }}" != "skipped" ]; then
            echo "::error::HIL Test für EPD13 fehlgeschlagen! Pipeline wird beendet."
            exit 1
          fi

          if [ "${{ needs.deploy_pre.result }}" != "success" ]; then
            echo "::error::Pre-Deployment fehlgeschlagen oder übersprungen (Hardware-Tests nicht bestanden)! Pipeline wird beendet."
            exit 1
          fi

          if [ "${{ needs.deploy_prod_epd7.result }}" != "success" ]; then
            echo "::error::Prod-Deployment für EPD7 fehlgeschlagen oder übersprungen! Pipeline wird beendet."
            exit 1
          fi

          if [ "${{ needs.deploy_prod_epd13.result }}" != "success" ]; then
            echo "::error::Prod-Deployment für EPD13 fehlgeschlagen oder übersprungen! Pipeline wird beendet."
            exit 1
          fi

          if [ -f "hil_test_protocol.json" ]; then
            overall=$(python -c "import json; print(json.load(open('hil_test_protocol.json')).get('overall_success', False))")
            if [ "$overall" != "True" ]; then
              echo "::error::Gesamtbewertung negativ (Tests fehlgeschlagen oder KI-Risikoanalyse blockiert)!"
              exit 1
            fi
          fi
          
          echo "🎉 Alle Schritte, Deployments und Hardware-Tests erfolgreich bestanden!"
