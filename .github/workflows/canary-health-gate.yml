name: "Canary Health Gate (Phase 3)"
run-name: "Canary: ${{ inputs.action }} (${{ github.ref_name }})"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Aktion"
        required: true
        type: choice
        default: "deploy"
        options:
          - "deploy"
          - "monitor"
          - "reset"
      target_devices:
        description: "Zielgeräte-IDs (z. B. 'epd7-xxxx, epd13-yyyy' - leer lassen für canary_target_devices.json)"
        required: false
        default: ""
      confirm_execution:
        description: "⚠️ Bestätigung: Shadow-Änderung ('deploy' oder 'reset') für die Zielgeräte ausführen"
        required: false
        type: boolean
        default: true

jobs:
  canary:
    name: "Canary: ${{ inputs.action }} (${{ github.ref_name }})"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 requests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      # -------------------------------------------------------------
      # 1. AKTION: DEPLOY (Canary Shadow setzen)
      # -------------------------------------------------------------
      - name: Deploy Canary OTA URL to Target Devices
        if: inputs.action == 'deploy'
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
          AWS_IOT_ENDPOINT: ${{ secrets.AWS_IOT_ENDPOINT }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || secrets.HIL_S3_BUCKET }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          dev_arg=""
          if [ -n "${{ inputs.target_devices }}" ]; then
            dev_arg="--device-ids ${{ inputs.target_devices }}"
          fi

          if [ "${{ inputs.confirm_execution }}" = "true" ]; then
            echo "🚀 Ausrollen autorisiert: Setze Named Shadows für Zielgeräte..."
            python tools/select_pilot_devices.py \
              $dev_arg \
              --deploy \
              --apply \
              --confirm-ota I_CONFIRM_CANARY_OTA
          else
            echo "::warning::Sicherheits-Checkbox war nicht aktiviert! Führe DRY-RUN Simulation aus."
            python tools/select_pilot_devices.py \
              $dev_arg \
              --deploy
          fi

      # -------------------------------------------------------------
      # 2. AKTION: RESET (Rollback auf reguläre Hauptversion)
      # -------------------------------------------------------------
      - name: Reset Canary Shadow for Target Devices
        if: inputs.action == 'reset'
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
          AWS_IOT_ENDPOINT: ${{ secrets.AWS_IOT_ENDPOINT }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || secrets.HIL_S3_BUCKET }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          dev_arg=""
          if [ -n "${{ inputs.target_devices }}" ]; then
            dev_arg="--device-ids ${{ inputs.target_devices }}"
          fi

          if [ "${{ inputs.confirm_execution }}" = "true" ]; then
            echo "🔄 Zurücksetzen autorisiert: Setze Zielgeräte auf reguläre Hauptversion (main/production)..."
            python tools/select_pilot_devices.py \
              $dev_arg \
              --reset \
              --apply \
              --confirm-ota I_CONFIRM_CANARY_OTA
          else
            echo "::warning::Sicherheits-Checkbox war nicht aktiviert! Führe DRY-RUN Simulation aus."
            python tools/select_pilot_devices.py \
              $dev_arg \
              --reset
          fi

      # -------------------------------------------------------------
      # 3. AKTION: MONITOR / HEALTH GATE
      # -------------------------------------------------------------
      - name: Run Canary Health Gate Monitor
        if: inputs.action == 'monitor' || ((inputs.action == 'deploy' || inputs.action == 'reset') && inputs.confirm_execution == true)
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
          AWS_IOT_ENDPOINT: ${{ secrets.AWS_IOT_ENDPOINT }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || secrets.HIL_S3_BUCKET }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          devices_arg=""
          if [ -n "${{ inputs.target_devices }}" ]; then
            devices_arg="--device-ids ${{ inputs.target_devices }}"
          fi

          reset_arg=""
          if [ "${{ inputs.action }}" = "reset" ]; then
            reset_arg="--reset"
          fi

          python tools/canary_monitor.py \
            $devices_arg \
            $reset_arg \
            --watch \
            --interval 30 \
            --timeout 600 \
            --min-adoption 80 \
            --max-anomalies 0 \
            --output-md canary_health_report.md \
            --output-json canary_health_report.json

      - name: Upload Canary Health Gate Report Artifact
        if: (inputs.action == 'monitor' || inputs.action == 'deploy' || inputs.action == 'reset') && always()
        uses: actions/upload-artifact@v7
        with:
          name: canary_health_report_${{ github.ref_name }}
          path: |
            canary_health_report.md
            canary_health_report.json
